<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directorio de Personal - Rutina Café</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-principal: #F9F6F0;
            --texto-oscuro: #4A3B32;
            --texto-medio: #8B7355;
            --acento-suave: #D4C4B7;
            --blanco-puro: #FFFFFF;
            --borde-suave: #E8E1D9;
            --norte-color: #C89F7C;
            --sur-color: #9BA48A;
        }

        body { 
            font-family: 'Poppins', sans-serif; 
            padding: 0; 
            margin: 0; 
            background-color: var(--bg-principal); 
            color: var(--texto-oscuro);
        }
        
        nav { 
            background-color: var(--blanco-puro); 
            padding: 15px 30px; 
            display: flex; 
            gap: 15px; 
            box-shadow: 0 2px 10px rgba(74, 59, 50, 0.05);
            border-bottom: 1px solid var(--borde-suave);
        }
        nav a { 
            color: var(--texto-medio); 
            text-decoration: none; 
            font-weight: 500; 
            font-size: 14px;
            padding: 10px 18px; 
            border-radius: 8px; 
            transition: all 0.3s ease;
        }
        nav a:hover { 
            background-color: var(--bg-principal); 
            color: var(--texto-oscuro);
        }
        nav a.activo { 
            background-color: var(--texto-oscuro); 
            color: var(--blanco-puro); 
        }

        .container { padding: 30px; max-width: 1000px; margin: 0 auto; }
        
        .header { 
            margin-bottom: 25px; 
        }
        h1 { 
            margin: 0; 
            font-size: 26px; 
            font-weight: 600; 
            color: var(--texto-oscuro);
        }
        
        .tabla-contenedor {
            background: var(--blanco-puro);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(74, 59, 50, 0.04);
            border: 1px solid var(--borde-suave);
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid var(--borde-suave); }
        
        th { 
            background-color: var(--bg-principal); 
            color: var(--texto-oscuro); 
            font-weight: 600; 
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--borde-suave);
        }
        
        select {
            font-family: 'Poppins', sans-serif;
            padding: 8px 12px;
            border: 1px solid var(--borde-suave);
            border-radius: 8px;
            background-color: var(--bg-principal);
            color: var(--texto-oscuro);
            font-size: 14px;
            outline: none;
            cursor: pointer;
        }
        select:focus { border-color: var(--texto-medio); }

        tbody tr:nth-child(even) { background-color: #FAFAFA; }
        tbody tr:hover { background-color: var(--bg-principal); }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="activo">Directorio</a>
        <a href="/vista.html">Programar Turnos</a>
        <a href="/matriz-operativa.html">Vista General</a>
    </nav>

    <div class="container">
        <div class="header">
            <h1>Directorio de Personal</h1>
        </div>

        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Cargo</th>
                        <th>Sede Asignada</th>
                    </tr>
                </thead>
                <tbody id="tabla-empleados">
                    <!-- Datos cargados por JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function cargarEmpleados() {
            try {
                const respuesta = await fetch('/api/empleados');
                const empleados = await respuesta.json();
                
                const tbody = document.getElementById('tabla-empleados');
                tbody.innerHTML = ''; 

                empleados.forEach(emp => {
                    const fila = document.createElement('tr');
                    
                    fila.innerHTML = `
                        <td style="font-weight: 500;">${emp.nombre}</td>
                        <td style="color: var(--texto-medio);">${emp.cargo || 'Sin cargo'}</td>
                        <td>
                            <select onchange="actualizarSede(${emp.id}, this.value)">
                                <option value="">Por asignar...</option>
                                <option value="1" ${emp.sede_id === 1 ? 'selected' : ''}>Norte</option>
                                <option value="2" ${emp.sede_id === 2 ? 'selected' : ''}>Sur</option>
                            </select>
                        </td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (error) {
                console.error('Error cargando los empleados:', error);
            }
        }

        async function actualizarSede(empleadoId, nuevaSedeId) {
            try {
                await fetch(`/api/empleados/${empleadoId}/sede`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sede_id: nuevaSedeId })
                });
            } catch (error) {
                console.error('Error en la petición:', error);
            }
        }

        cargarEmpleados();
    </script>
</body>
</html>
